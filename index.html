<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WorkManager</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<main id="app" class="container" v-cloak>
		<h1>WorkManager</h1>

		<p v-if="isLoading || isMasterLoading" class="message">データをロード中です...</p>
		<p v-if="message" class="message" :class="messageType" role="status">
			{{ message }}
		</p>
		<p v-if="masterLoadMessage" class="message error" role="alert">
			{{ masterLoadMessage }}
		</p>

		<div v-if="!isLoading && !isMasterLoading && rows.length && viewMode === 'list'" class="table-wrapper">
			<table>
				<thead>
					<tr>
						<th v-for="(cell, cellIndex) in displayRow(headerRow)" :key="cellIndex">
							{{ formatCell(cell) }}
						</th>
					</tr>
				</thead>
				<tbody>
					<tr
						v-for="(row, rowIndex) in paginatedRows"
						:key="pageStartIndex + rowIndex"
						class="project-row"
						tabindex="0"
						@click="openProject(rowIndex)"
						@keydown.enter="openProject(rowIndex)"
					>
						<td v-for="(cell, cellIndex) in displayRow(row)" :key="cellIndex">
							{{ formatCell(cell) }}
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<nav
			v-if="!isLoading && !isMasterLoading && rows.length && viewMode === 'list'"
			class="pagination"
			aria-label="ページ切り替え"
		>
			<button type="button" @click="previousPage" :disabled="currentPage === 1">
				前へ
			</button>
			<span>{{ currentPage }} / {{ totalPages }}ページ（全{{ totalItems }}件）</span>
			<button type="button" @click="nextPage" :disabled="currentPage === totalPages">
				次へ
			</button>
		</nav>

		<section v-if="!isLoading && !isMasterLoading && viewMode === 'edit'" class="project-editor">
			<div class="editor-toolbar">
				<button type="button" class="secondary-button" @click="backToList">
					一覧へ戻る
				</button>
				<h2>案件の編集</h2>
			</div>

			<div v-for="group in editFieldGroups" :key="group.title" class="editor-section">
				<h3>{{ group.title }}</h3>
				<div class="form-grid">
					<label
						v-for="field in group.fields"
						:key="field.index"
						class="form-field"
						:class="{ 'form-field-wide': /案件名|件名|住所/.test(field.label) }"
					>
						<span>{{ field.label }}</span>
						<select
							v-if="field.label.replace(/\s/g, '') === '取引先名'"
							v-model="editableRow[field.index]"
							:disabled="!customerMaster || isSaving"
							@change="onCustomerChanged"
						>
							<option value="">取引先を選択してください</option>
							<option
								v-if="editableRow[field.index] && !customerNames.includes(editableRow[field.index])"
								:value="editableRow[field.index]"
							>{{ editableRow[field.index] }}（現在値・マスター未登録）</option>
							<option v-for="name in customerNames" :key="name" :value="name">{{ name }}</option>
						</select>
						<select
							v-else-if="field.label.replace(/\s/g, '') === '担当者氏名'"
							v-model="editableRow[field.index]"
							:disabled="!customerContactMaster || !selectedCustomerName || isSaving"
							@change="onContactChanged"
						>
							<option value="">{{ !selectedCustomerName ? '先に取引先を選択してください' : contactNames.length ? '担当者を選択してください' : '該当する担当者がいません' }}</option>
							<option
								v-if="editableRow[field.index] && !contactNames.includes(editableRow[field.index])"
								:value="editableRow[field.index]" disabled
							>{{ editableRow[field.index] }}（現在値・候補外）</option>
							<option v-for="name in contactNames" :key="name" :value="name">{{ name }}</option>
						</select>
						<input v-else type="text" v-model="editableRow[field.index]">
					</label>
				</div>
			</div>

			<div class="editor-actions">
				<button type="button" @click="saveProjectChanges" :disabled="isSaving">
					{{ isSaving ? '保存中...' : '変更を保存' }}
				</button>
				<button type="button" class="secondary-button" @click="backToList" :disabled="isSaving">
					キャンセル
				</button>
			</div>
		</section>

		<p v-if="!isLoading && !isMasterLoading && !rows.length && !message" class="message">
			表示できるデータがありません。
		</p>

		<button
			v-if="viewMode === 'list'"
			class="save-button"
			type="button"
			@click="saveTestData"
			:disabled="isLoading || isMasterLoading || isSaving || !workbook"
		>
			{{ isSaving ? '保存中...' : '保存テスト' }}
		</button>
	</main>

	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
	<script src="./js/app.js"></script>
</body>
</html>
